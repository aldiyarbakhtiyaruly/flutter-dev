name: Improved CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test
        run: echo "Test passed"

      - name: Lint check
        run: echo "Lint passed"

      - name: Build project
        run: echo "Build complete"

      - name: Check README
        run: grep "project" README.md
